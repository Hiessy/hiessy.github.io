<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Diaz · Software</title>
<meta name="description" content="Página personal. Los logros son mentira, el entusiasmo no.">
<style>
*{box-sizing:border-box}
:root{--bg:#faf8f5;--ink:#1c1a17;--mut:#6f675d;--line:#e5ded4;--acc:#8a5a2b;--pick:#b8862f;--card:#fff;
 --wall:#e2dacd;--suelo:#fdfcfa;--mugre:#d8cdb9}
@media(prefers-color-scheme:dark){:root{--bg:#141311;--ink:#f0ece6;--mut:#9c948a;--line:#2c2926;
 --acc:#d9a066;--pick:#e0b05a;--card:#1c1a18;--wall:#302c27;--suelo:#1a1816;--mugre:#3b352d}}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
/* --- idioma: dos botoncitos arriba a la derecha ------------------------- */
.lang{position:absolute;top:16px;right:20px;display:flex;gap:4px}
.lang button{font:inherit;font-size:11.5px;letter-spacing:.04em;padding:4px 9px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px}
.lang button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang button:hover{border-color:var(--acc)}
@media(max-width:620px){.lang{position:static;justify-content:flex-end;padding:14px 20px 0}}
header{padding:64px 0 10px;position:relative}
@media(max-width:620px){header{padding:18px 0 6px}}
h1{font-size:clamp(32px,7vw,54px);line-height:1.05;margin:0 0 10px;letter-spacing:-.03em}
.role{margin:0 0 14px;font-size:clamp(15px,2.6vw,19px);color:var(--acc);font-weight:600;
 letter-spacing:-.01em;line-height:1.3}
.sub{margin:0;color:var(--mut);max-width:58ch}
h2{font-size:12.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;
 margin:48px 0 16px;font-weight:600}
/* --- logros ------------------------------------------------------------- */
ol.logros{margin:0;padding:0;list-style:none;counter-reset:l}
ol.logros li{counter-increment:l;position:relative;padding:11px 0 11px 42px;
 border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.55}
ol.logros li:last-child{border-bottom:0}
ol.logros li::before{content:counter(l,decimal-leading-zero);position:absolute;left:0;top:12px;
 font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.04em}
ol.logros code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
 background:var(--line);padding:1px 5px;border-radius:4px}
/* --- numeritos ---------------------------------------------------------- */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;
 padding:20px 0 0;border-top:1px solid var(--line);margin-top:10px}
.nums div b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
 line-height:1.1;color:var(--acc)}
.nums div span{font-size:12px;color:var(--mut);line-height:1.35;display:block;margin-top:3px}
/* --- el juego ----------------------------------------------------------- */
.hint{margin:0 0 14px;font-size:13.5px;color:var(--mut)}
.marco{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
 display:flex;flex-direction:column;align-items:center;gap:10px}
canvas{width:100%;max-width:480px;aspect-ratio:13/11;display:block;border-radius:8px;
 touch-action:none;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.hud{display:flex;gap:16px;width:100%;max-width:480px;font-size:12.5px;color:var(--mut);
 font-variant-numeric:tabular-nums;justify-content:center;flex-wrap:wrap}
.hud b{color:var(--ink);font-weight:650}
/* cruceta: en el teléfono no hay flechas */
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;
 justify-content:center}
.dpad button{font:inherit;font-size:17px;border:1px solid var(--line);background:var(--bg);
 color:var(--ink);border-radius:9px;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad button:active{background:var(--line)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}
.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media(hover:hover) and (pointer:fine){.dpad{display:none}}
footer{margin:56px 0 0;padding:22px 0 72px;border-top:1px solid var(--line);
 color:var(--mut);font-size:13px;line-height:1.65}
footer b{color:var(--ink)}
</style></head><body>

<div class="lang">
 <button id="bes" class="on">ES</button><button id="ben">EN</button>
</div>

<div class="wrap">
<header>
 <h1>Martin Diaz</h1>
 <p class="role" data-es="Ingeniero senior · Responsable de soluciones temporales, varias de ellas estructurales"
    data-en="Senior engineer · Head of temporary solutions, several of them load-bearing"></p>
 <p class="sub"
    data-es="Lee documentación por voluntad propia, cosa que sus colegas describen como señal de alarma. Hace muchas preguntas, la mayoría después del despliegue. Disfruta genuinamente de trabajar con otra gente, preferencia que sobrevivió a abundante evidencia en contra."
    data-en="Reads documentation voluntarily, which colleagues have described as a warning sign. Asks a great many questions, most of them after the deployment. Genuinely enjoys working with other people, a preference that has survived considerable evidence against it."></p>
</header>

<h2 data-es="Logros seleccionados, verificados de manera independiente"
    data-en="Selected achievements, independently verified"></h2>
<ol class="logros">
<li data-es="Entregué un proyecto de dos semanas en nueve meses, cómodamente antes del tercer plazo revisado."
    data-en="Delivered a two-week project in nine months, comfortably ahead of the third revised deadline."></li>
<li data-es="La batería de tests es exhaustiva y está enteramente en verde, siempre que nadie la ejecute."
    data-en="The test suite is comprehensive and entirely green, provided nobody runs it."></li>
<li data-es="Documenté el sistema completo. La documentación sigue siendo exacta a un martes de 2019."
    data-en="Documented the entire system. The documentation remains accurate as of a Tuesday in 2019."></li>
<li data-es="Reduje la cantidad de reuniones mediante una reunión semanal destinada a seguir la reducción."
    data-en="Reduced the number of meetings by introducing a weekly meeting to track the reduction."></li>
<li data-es="Alcancé observabilidad total: hoy tenemos tableros que confirman, en tiempo real, que nadie sabe qué está pasando."
    data-en="Achieved complete observability: we now have dashboards confirming, in real time, that nobody knows what is happening."></li>
<li data-es="Migré todo a la nube, donde los costos pasaron a ser plenamente variables, en el sentido de que sólo varían hacia arriba."
    data-en="Migrated everything to the cloud, where costs are now fully variable, in the sense that they vary only upward."></li>
<li data-es="Escribí una solución provisoria en 2019. Es el componente más estable del sistema y de ella dependen tres equipos."
    data-en="Wrote a stopgap in 2019. It is the most stable component in the system and three teams depend on it."></li>
<li data-es="Estimé el trabajo con precisión. La estimación fue luego negociada, proceso que, como es sabido, mejora las estimaciones."
    data-en="Estimated the work accurately. The estimate was then negotiated, a process widely understood to improve estimates."></li>
<li data-es="Instalé una cultura de revisión de código en la que todo comentario empieza con «una cosita nomás»."
    data-en="Established a code review culture in which every comment opens with “just one small thing”."></li>
<li data-es="Dejé el sistema heredado funcionando sin tocarlo. La decisión se revisa todos los años y se ratifica todos los años."
    data-en="Left the legacy system running untouched. The decision is reviewed annually and reaffirmed annually."></li>
</ol>

<div class="nums">
 <div><b>47</b><span data-es="soluciones provisorias todavía en producción" data-en="stopgaps still running in production"></span></div>
 <div><b>212</b><span data-es="tableros que nadie abrió nunca" data-en="dashboards nobody has ever opened"></span></div>
 <div><b>31</b><span data-es="estimaciones mejoradas por negociación" data-en="estimates improved through negotiation"></span></div>
 <div><b>0</b><span data-es="análisis post mortem que hallaron una sola causa" data-en="post-mortems that found a single cause"></span></div>
</div>

<h2 data-es="Una herramienta de productividad" data-en="A productivity tool"></h2>
<p class="hint"
   data-es="<b>Janitor Joe, edición producción.</b> Trapeá cada baldosa mientras los bugs andan sueltos. Ampliamente considerada una simulación realista del puesto. Flechas o WASD; en el teléfono, la cruceta. Tocá el tablero para empezar."
   data-en="<b>Janitor Joe, production edition.</b> Mop every tile while the bugs roam free. Widely regarded as a realistic simulation of the role. Arrows or WASD; on a phone, the pad. Tap the board to start."></p>
<div class="marco">
 <canvas id="g" tabindex="0" aria-label="Janitor Joe"></canvas>
 <div class="hud">
  <span data-es="Nivel" data-en="Level"></span>&nbsp;<b id="hlvl">1</b>
  <span data-es="Puntos" data-en="Score"></span>&nbsp;<b id="hpts">0</b>
  <span data-es="Vidas" data-en="Lives"></span>&nbsp;<b id="hvid">3</b>
 </div>
 <div class="dpad">
  <button class="u" data-dir="u" aria-label="arriba">↑</button>
  <button class="l" data-dir="l" aria-label="izquierda">←</button>
  <button class="d" data-dir="d" aria-label="abajo">↓</button>
  <button class="r" data-dir="r" aria-label="derecha">→</button>
 </div>
</div>

<footer>
 <p data-es="Nada de lo anterior es cierto, salvo dos cosas: me gusta aprender y me gusta trabajar con gente. El resto se presenta con el mismo rigor con que la industria presenta casi todo."
    data-en="None of the above is true, with two exceptions: I like learning things and I like working with people. The rest is presented with the same rigour the industry applies to most things."></p>
</footer>
</div>

<script>
// --- idioma ---------------------------------------------------------------
// Cada texto viaja en `data-es` y `data-en`; acá sólo se elige cuál se muestra.
// Arranca en el idioma del navegador y recuerda lo que elijas.
const LK='hiessy:idioma';
let idioma='es';
function pintarIdioma(l){
 idioma=l;
 document.documentElement.lang=l;
 for(const el of document.querySelectorAll('[data-es]')){
  const v=el.getAttribute('data-'+l);
  if(v!==null)el.innerHTML=v;          // sólo texto nuestro, no entra nada de afuera
 }
 bes.classList.toggle('on',l==='es');
 ben.classList.toggle('on',l==='en');
 try{localStorage.setItem(LK,l)}catch(e){}
 dibujar();                            // los carteles del juego también cambian
}
// Se llama al final del script, no acá: `pintarIdioma` termina en `dibujar()`,
// y las variables del juego son `let` declaradas más abajo. Invocarlo antes
// moría con "Cannot access 'sucio' before initialization" —ni el `if(!sucio)`
// salva, que leer un `let` en su zona muerta ya tira— y se llevaba puesto todo
// el resto del script, juego incluido.
function idiomaInicial(){
 let l=null;
 try{l=localStorage.getItem(LK)}catch(e){}
 if(l!=='es'&&l!=='en')l=(navigator.language||'es').toLowerCase().startsWith('es')?'es':'en';
 pintarIdioma(l);
}
bes.onclick=()=>pintarIdioma('es');
ben.onclick=()=>pintarIdioma('en');

// --- Janitor Joe ----------------------------------------------------------
// Homenaje al de MS-DOS del 84: pasillos, bichos que te persiguen y el piso
// para dejar limpio. Acá el piso es producción y los bichos son los bugs.
const MAPA=[
 "#############",
 "#...........#",
 "#.##.###.##.#",
 "#...........#",
 "#.#.#####.#.#",
 "#.#.......#.#",
 "#.#.#####.#.#",
 "#...........#",
 "#.##.###.##.#",
 "#...........#",
 "#############"];
const COLS=MAPA[0].length, FILAS=MAPA.length;
const pared=(f,c)=>f<0||c<0||f>=FILAS||c>=COLS||MAPA[f][c]==='#';

const cv=document.getElementById('g'), cx=cv.getContext('2d');
const hlvl=document.getElementById('hlvl'), hpts=document.getElementById('hpts'),
      hvid=document.getElementById('hvid');

let celda=20, sucio, joe, bugs, dir, pedido, nivel, puntos, vidas, estado, tJoe, tBug;
// estado: 'listo' (esperando el primer toque) | 'juega' | 'muerto' | 'fin'

function medir(){
 const w=cv.clientWidth||320;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(w*dpr);
 cv.height=Math.round(w*(FILAS/COLS)*dpr);
 cx.setTransform(dpr,0,0,dpr,0,0);
 celda=w/COLS;
 dibujar();
}

function ensuciar(){
 sucio=new Set();
 for(let f=0;f<FILAS;f++)for(let c=0;c<COLS;c++)if(!pared(f,c))sucio.add(f+','+c);
}
function posiciones(){
 joe={f:1,c:1};
 sucio.delete('1,1');
 // los bugs salen de las otras tres esquinas, lejos de Joe
 bugs=[{f:1,c:COLS-2},{f:FILAS-2,c:1},{f:FILAS-2,c:COLS-2}]
      .slice(0,Math.min(3,1+nivel)).map(b=>({...b}));
 dir=null;pedido=null;tJoe=0;tBug=0;
}
function nuevaPartida(){
 nivel=1;puntos=0;vidas=3;ensuciar();posiciones();estado='listo';marcador();dibujar();
}
function nivelNuevo(){
 nivel++;ensuciar();posiciones();estado='juega';marcador();
}
function marcador(){hlvl.textContent=nivel;hpts.textContent=puntos;hvid.textContent=vidas;}

function mover(p,d){
 const f=p.f+(d==='d'?1:d==='u'?-1:0), c=p.c+(d==='r'?1:d==='l'?-1:0);
 return pared(f,c)?null:{f,c};
}

function pasoJoe(){
 if(pedido){const n=mover(joe,pedido);if(n){dir=pedido;pedido=null;}}
 if(!dir)return;
 const n=mover(joe,dir);
 if(!n){dir=null;return;}
 joe=n;
 const k=joe.f+','+joe.c;
 if(sucio.has(k)){sucio.delete(k);puntos+=10;marcador();}
 if(!sucio.size){puntos+=100;nivelNuevo();}
}

function pasoBugs(){
 for(const b of bugs){
  // persecución simple: probar primero el eje donde más lejos está Joe
  const op=[];
  if(b.f<joe.f)op.push('d');else if(b.f>joe.f)op.push('u');
  if(b.c<joe.c)op.push('r');else if(b.c>joe.c)op.push('l');
  if(Math.abs(b.c-joe.c)>Math.abs(b.f-joe.f))op.reverse();
  // un poco de azar: si no, quedan trabados contra la misma pared para siempre
  if(Math.random()<.25)op.push(...['u','d','l','r'].sort(()=>Math.random()-.5));
  else op.push(...['u','d','l','r']);
  for(const d of op){const n=mover(b,d);if(n){b.f=n.f;b.c=n.c;break;}}
 }
}

function choque(){return bugs.some(b=>b.f===joe.f&&b.c===joe.c);}

function perder(){
 vidas--;marcador();
 if(vidas<=0){estado='fin';}
 else{estado='muerto';setTimeout(()=>{if(estado==='muerto'){posiciones();estado='juega';}},900);}
}

// --- dibujo ---------------------------------------------------------------
function cartel(txt,sub){
 cx.fillStyle='rgba(0,0,0,.62)';
 cx.fillRect(0,0,COLS*celda,FILAS*celda);
 cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';
 cx.font='700 '+Math.round(celda*1.05)+'px ui-sans-serif,system-ui,sans-serif';
 cx.fillText(txt,COLS*celda/2,FILAS*celda/2-celda*.35);
 if(sub){
  cx.font=''+Math.round(celda*.62)+'px ui-sans-serif,system-ui,sans-serif';
  cx.fillStyle='rgba(255,255,255,.85)';
  cx.fillText(sub,COLS*celda/2,FILAS*celda/2+celda*.75);
 }
}
function dibujar(){
 if(!sucio)return;
 const st=getComputedStyle(document.documentElement);
 const cPared=st.getPropertyValue('--wall')||'#e2dacd';
 const cSuelo=st.getPropertyValue('--suelo')||'#fff';
 const cMugre=st.getPropertyValue('--mugre')||'#d8cdb9';
 cx.clearRect(0,0,COLS*celda,FILAS*celda);
 for(let f=0;f<FILAS;f++)for(let c=0;c<COLS;c++){
  const x=c*celda,y=f*celda;
  if(pared(f,c)){cx.fillStyle=cPared;cx.fillRect(x,y,celda+.5,celda+.5);}
  else{
   cx.fillStyle=cSuelo;cx.fillRect(x,y,celda+.5,celda+.5);
   if(sucio.has(f+','+c)){            // baldosa sin trapear
    cx.fillStyle=cMugre;cx.beginPath();
    cx.arc(x+celda/2,y+celda/2,celda*.13,0,6.284);cx.fill();
   }
  }
 }
 cx.textAlign='center';cx.textBaseline='middle';
 cx.font=Math.round(celda*.78)+'px serif';
 for(const b of bugs)cx.fillText('🐛',b.c*celda+celda/2,b.f*celda+celda/2+celda*.04);
 cx.fillText(estado==='muerto'?'💥':'🧹',joe.c*celda+celda/2,joe.f*celda+celda/2+celda*.04);
 const T={
  listo:{es:['Tocá para empezar','flechas · WASD · cruceta'],
         en:['Tap to start','arrows · WASD · pad']},
  fin:{es:['Se acabó','tocá para volver a empezar'],
       en:['Game over','tap to play again']}};
 if(T[estado])cartel(T[estado][idioma][0],T[estado][idioma][1]);
}

// --- bucle ----------------------------------------------------------------
// Va con `setInterval` y no con `requestAnimationFrame`: el juego avanza de a
// casilleros cada 135 ms, así que no necesita 60 fps, y rAF no corre en pestañas
// de fondo ni en algunos visores embebidos —queda congelado sin avisar—. Con el
// timer anda igual en todos lados; para no gastar batería al pedo, se pausa solo
// cuando la pestaña no se ve.
let ult=0;
function tic(t){
 const dt=Math.min(t-ult,250);ult=t;     // volver de una pestaña oculta no teletransporta a nadie
 if(estado==='juega'){
  tJoe+=dt;tBug+=dt;
  const vJoe=135, vBug=Math.max(170,330-nivel*28);   // los bugs se avivan por nivel
  while(tJoe>=vJoe){tJoe-=vJoe;pasoJoe();if(estado!=='juega')break;}
  if(estado==='juega'&&choque())perder();
  while(estado==='juega'&&tBug>=vBug){tBug-=vBug;pasoBugs();if(choque()){perder();break;}}
  dibujar();
 }
}

// --- controles ------------------------------------------------------------
const TECLAS={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',
              w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
// El listener va en el canvas y no en window: así las flechas sólo dejan de
// scrollear la página cuando el tablero tiene el foco, que es cuando estás
// jugando. Secuestrar las flechas de toda la página sería bastante grosero.
cv.addEventListener('keydown',e=>{
 const d=TECLAS[e.key];
 if(!d)return;
 e.preventDefault();
 if(estado==='listo'||estado==='fin'){arrancar();}
 pedido=d;
});
function arrancar(){
 if(estado==='fin'||estado==='listo'){
  if(estado==='fin')nuevaPartida();
  estado='juega';ult=performance.now();tJoe=0;tBug=0;
 }
 cv.focus({preventScroll:true});
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();arrancar();});
for(const b of document.querySelectorAll('.dpad button')){
 b.addEventListener('pointerdown',e=>{e.preventDefault();arrancar();pedido=b.dataset.dir;});
}
// deslizar con el dedo sobre el tablero también mueve
let tq=null;
cv.addEventListener('touchstart',e=>{tq=e.touches[0];},{passive:true});
cv.addEventListener('touchmove',e=>{
 if(!tq)return;
 const t=e.touches[0],dx=t.clientX-tq.clientX,dy=t.clientY-tq.clientY;
 if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
 pedido=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
 tq=t;
},{passive:true});

new ResizeObserver(medir).observe(cv);
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',dibujar);
let reloj=null;
function correr(on){
 if(on&&!reloj){ult=performance.now();reloj=setInterval(()=>tic(performance.now()),33);}
 else if(!on&&reloj){clearInterval(reloj);reloj=null;}
}
document.addEventListener('visibilitychange',()=>correr(!document.hidden));

nuevaPartida();medir();idiomaInicial();correr(!document.hidden);
</script>
</body></html>
