<!doctype html>
<!-- Sólo estructura: ni un texto visible, ni estilos, ni lógica.
     Los textos están en `i18n/<idioma>.json` y cada elemento dice qué clave le
     toca (`data-i18n`, `data-i18n-attr`). El idioma del atributo `lang` lo
     corrige `js/i18n.js` al cargar. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="meta.titulo">Martin Diaz</title>
<meta name="description" data-i18n-attr="content=meta.descripcion" content="">
<link rel="stylesheet" href="css/portada.css">
</head>
<body>

<div class="lang" id="lang"><!-- los botones los arma js/i18n.js desde su lista de idiomas --></div>

<div class="wrap">
<header>
 <p class="ln cmd" data-i18n="cabecera.cmd"></p>
 <h1 class="ln" data-i18n="cabecera.nombre"></h1>
 <p class="ln role" data-i18n="cabecera.rol"></p>
 <p class="ln sub" data-i18n="cabecera.resumen"></p>
</header>

<h2 class="ln cmd" data-i18n="logros.cmd"></h2>
<p class="ln hint" data-i18n="logros.ayuda"></p>
<div class="rolo-caja ln">
 <div class="rolo" id="rolo" role="group" data-i18n-attr="aria-label=logros.aria">
  <div class="eje"></div>
  <ol class="tambor">
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 01</span>
    <p data-i18n="logros.01"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 02</span>
    <p data-i18n="logros.02"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 03</span>
    <p data-i18n="logros.03"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 04</span>
    <p data-i18n="logros.04"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 05</span>
    <p data-i18n="logros.05"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 06</span>
    <p data-i18n="logros.06"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 07</span>
    <p data-i18n="logros.07"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 08</span>
    <p data-i18n="logros.08"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 09</span>
    <p data-i18n="logros.09"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 10</span>
    <p data-i18n="logros.10"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 11</span>
    <p data-i18n="logros.11"></p>
   </div>
   <div class="dorso"></div>
  </li>
  <li class="ficha">
   <div class="papel">
    <span class="folio"><span data-i18n="logros.ficha"></span> 12</span>
    <p data-i18n="logros.12"></p>
   </div>
   <div class="dorso"></div>
  </li>
  </ol>
 </div>
 <div class="rolo-ctrl">
  <button type="button" class="rolo-btn" data-dir="ant"
          data-i18n-attr="aria-label=logros.anterior;title=logros.anterior">▲</button>
  <button type="button" class="rolo-btn" data-dir="sig"
          data-i18n-attr="aria-label=logros.siguiente;title=logros.siguiente">▼</button>
 </div>
</div>

<div class="nums ln">
 <div><b data-i18n="nums.01.valor"></b><span data-i18n="nums.01.pie"></span></div>
 <div><b data-i18n="nums.02.valor"></b><span data-i18n="nums.02.pie"></span></div>
 <div><b data-i18n="nums.03.valor"></b><span data-i18n="nums.03.pie"></span></div>
 <div><b data-i18n="nums.04.valor"></b><span data-i18n="nums.04.pie"></span></div>
</div>

<h2 class="ln cmd" data-i18n="juego.cmd"></h2>
<p class="ln hint" data-i18n="juego.ayuda"></p>
<div class="marco">
 <canvas id="g" tabindex="0" data-i18n-attr="aria-label=juego.aria"></canvas>
 <div class="hud">
  <span data-i18n="juego.nivel"></span>&nbsp;<b id="hlvl">1</b>
  <span data-i18n="juego.puntos"></span>&nbsp;<b id="hpts">0</b>
  <span data-i18n="juego.vidas"></span>&nbsp;<b id="hvid">3</b>
 </div>
 <div class="pad">
  <div class="cruz">
   <button class="u" data-k="u" data-i18n-attr="aria-label=juego.arriba">↑</button>
   <button class="l" data-k="l" data-i18n-attr="aria-label=juego.izquierda">←</button>
   <button class="d" data-k="d" data-i18n-attr="aria-label=juego.abajo">↓</button>
   <button class="r" data-k="r" data-i18n-attr="aria-label=juego.derecha">→</button>
  </div>
  <button class="salto" data-k="j" data-i18n="juego.salto"
          data-i18n-attr="aria-label=juego.salto"></button>
 </div>
</div>

<h2 class="ln cmd" data-i18n="sh.cmd"></h2>
<p class="ln hint" data-i18n="sh.ayuda"></p>
<div class="sh ln" id="sh" role="group" data-i18n-attr="aria-label=sh.aria">
 <div class="sh-out" id="sh-out" aria-live="polite"></div>
 <div class="sh-linea">
  <span class="sh-ps" id="sh-ps">/ $ </span><input class="sh-in" id="sh-in" type="text"
   autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
   data-i18n-attr="aria-label=sh.aria">
 </div>
</div>

<footer>
 <p class="ln nota" data-i18n="pie.nota"></p>
</footer>
<p class="ln cmd fin"><span class="cur"></span></p>
</div>

<script src="js/i18n.js" defer></script>
<script src="js/rolodex.js" defer></script>
<script src="js/janitor-joe.js" defer></script>
<script src="js/shell.js" defer></script>
</body>
</html>
