<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Diaz · Software</title>
<meta name="description" content="Página personal. Los logros son mentira, el entusiasmo no.">
<style>
*{box-sizing:border-box}
/* Oscuro fijo, no sigue al sistema: la página imita el puesto de trabajo de
   madrugada —monitores encendidos, lámpara cálida de costado—, y en claro eso
   no existe. El resto del sitio sí respeta la preferencia del sistema. */
:root{--bg:#0a0b0d;--ink:#f4f2f0;--mut:#8b8782;--line:#23262e;
 --acc:#ff5a30;--amb:#ffb347;--card:#111318;
 --wall:#1b1f27;--suelo:#0d0f13;--mugre:#2e3340}
html{background:var(--bg)}
body{margin:0;color:var(--ink);
 font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased;
 /* el resplandor de los monitores arriba a la derecha y la lámpara a la izquierda */
 background:
  radial-gradient(1000px 680px at 80% -12%,rgba(255,90,48,.17),transparent 62%),
  radial-gradient(760px 520px at 6% -4%,rgba(255,179,71,.08),transparent 60%),
  var(--bg);
 background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* --- idioma ------------------------------------------------------------- */
.lang{position:absolute;top:18px;right:20px;display:flex;gap:5px}
.lang button{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:11px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;
 border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:4px}
.lang button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,90,48,.09)}
.lang button:hover{color:var(--ink);border-color:var(--acc)}
@media(max-width:620px){.lang{position:static;justify-content:flex-end;padding:14px 20px 0}}
/* --- cabecera ----------------------------------------------------------- */
header{padding:76px 0 12px;position:relative}
@media(max-width:620px){header{padding:20px 0 8px}}
.prompt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:12px;color:var(--mut);letter-spacing:.04em;margin:0 0 16px}
.prompt b{color:var(--acc);font-weight:400}
h1{font-size:clamp(42px,10vw,96px);line-height:.92;margin:0 0 18px;
 letter-spacing:-.035em;font-weight:900;text-transform:uppercase;
 text-shadow:0 0 42px rgba(255,90,48,.3)}
.role{margin:0 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:clamp(12px,2.1vw,14px);color:var(--amb);letter-spacing:.06em;
 text-transform:uppercase;line-height:1.5}
.sub{margin:0;color:var(--mut);max-width:62ch;font-size:15px}
h2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:11.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;
 margin:56px 0 18px;font-weight:400;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
/* --- logros: lista de terminal ------------------------------------------ */
ol.logros{margin:0;padding:0;list-style:none;counter-reset:l;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
ol.logros li{counter-increment:l;position:relative;padding:13px 0 13px 46px;
 border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.68;color:#d7d3cf}
ol.logros li:last-child{border-bottom:0}
ol.logros li::before{content:counter(l,decimal-leading-zero);position:absolute;left:0;top:14px;
 font-size:11.5px;color:var(--acc);letter-spacing:.06em}
ol.logros li:hover{color:var(--ink)}
ol.logros b{color:var(--amb);font-weight:600}
ol.logros code{font-size:.92em;background:rgba(255,90,48,.1);color:var(--acc);
 padding:1px 5px;border-radius:3px}
/* --- numeritos ---------------------------------------------------------- */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(154px,1fr));gap:20px;
 padding:26px 0 0;border-top:1px solid var(--line);margin-top:12px}
.nums div b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:30px;letter-spacing:-.02em;line-height:1.1;color:var(--acc);font-weight:700}
.nums div span{font-size:11.5px;color:var(--mut);line-height:1.45;display:block;margin-top:6px}
/* --- el juego ----------------------------------------------------------- */
.hint{margin:0 0 16px;font-size:13.5px;color:var(--mut);max-width:70ch}
.hint b{color:var(--ink)}
.marco{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;
 display:flex;flex-direction:column;align-items:center;gap:12px;
 box-shadow:0 0 70px rgba(255,90,48,.07) inset}
canvas{width:100%;max-width:480px;aspect-ratio:13/11;display:block;border-radius:6px;
 touch-action:none;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.hud{display:flex;gap:18px;width:100%;max-width:480px;justify-content:center;flex-wrap:wrap;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:11.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.hud b{color:var(--acc);font-weight:700}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px;
 justify-content:center}
.dpad button{font:inherit;font-size:17px;border:1px solid var(--line);background:var(--bg);
 color:var(--ink);border-radius:7px;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad button:active{background:rgba(255,90,48,.16);border-color:var(--acc)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}
.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media(hover:hover) and (pointer:fine){.dpad{display:none}}
footer{margin:64px 0 0;padding:24px 0 80px;border-top:1px solid var(--line);
 color:var(--mut);font-size:12.5px;line-height:1.7}
footer b{color:var(--ink)}
@media(max-width:620px){
 .wrap{padding:0 16px}
 .sub{font-size:14.5px}
 ol.logros li{padding-left:34px;font-size:13px}
 footer{padding-bottom:64px}
}
</style></head><body>

<div class="lang">
 <button id="bes" class="on">ES</button><button id="ben">EN</button>
</div>

<div class="wrap">
<header>
 <p class="prompt" data-es="<b>~/hiessy</b> $ whoami" data-en="<b>~/hiessy</b> $ whoami"></p>
 <h1>Martin Diaz</h1>
 <p class="role" data-es="Ingeniero senior · Entrega antes de que exista el requerimiento · Sin rollbacks hasta la fecha"
    data-en="Senior engineer · Ships before the requirement exists · No rollbacks to date"></p>
 <p class="sub"
    data-es="Aprende un stack nuevo en un fin de semana y para el martes ya revisa código ajeno escrito en ese stack. Hace la pregunta que la sala estaba por hacer, un día antes. Rinde mejor al lado de otra gente, cuyo rendimiento sube de manera medible y no vuelve al valor anterior."
    data-en="Learns a new stack over a weekend and is reviewing other people’s code in it by Tuesday. Asks the question the room was about to ask, one day earlier. Works best alongside other people, whose throughput measurably improves and does not return to baseline afterwards."></p>
</header>

<h2 data-es="Logros seleccionados, verificados de manera independiente"
    data-en="Selected achievements, independently verified"></h2>
<ol class="logros">
<li data-es="Entregué la funcionalidad tres trimestres antes de que Producto escribiera el requerimiento. Para entonces llevaba dos sprints en la beta, tenía 40.000 usuarios diarios y el ticket se cerró como <b>ya implementado</b>."
    data-en="Shipped the feature three quarters before Product wrote the requirement. By then it had been in the beta for two sprints, had 40,000 daily users, and the ticket was closed as <b>already done</b>."></li>
<li data-es="Optimicé la red mientras escribía las reglas de <code>iptables</code>. El throughput había subido 40% antes de que el firewall terminara de levantar, y la configuración quedó como referencia en cuatro regiones."
    data-en="Optimized the network while writing the <code>iptables</code> rules. Throughput was up 40% before the firewall finished coming online, and the configuration was adopted as the reference across four regions."></li>
<li data-es="Refactoricé la capa de autenticación durante la daily. La daily duró once minutos."
    data-en="Refactored the authentication layer during the stand-up. The stand-up ran eleven minutes."></li>
<li data-es="Identifiqué la causa raíz leyendo el stack trace mientras todavía subían los logs, parcheé en la misma llamada y el incidente bajó de severidad antes de que terminara de publicarse el status page."
    data-en="Identified the root cause from the stack trace while the logs were still uploading, patched it on the call, and the incident was downgraded before the status page finished publishing."></li>
<li data-es="Migré 1.200 servicios entre dos nubes sin una sola caída. El monitoreo no registró un solo evento. Se enteró primero Finanzas, cuando llegó la factura 60% más baja."
    data-en="Migrated 1,200 services across two clouds with zero downtime. Monitoring recorded no event at all. Finance noticed first, when the invoice arrived 60% lower."></li>
<li data-es="Revisé un pull request de 4.000 líneas de una sentada y encontré la única condición de carrera, que no se había disparado en tres años de producción."
    data-en="Reviewed a 4,000-line pull request in one sitting and found the single race condition, which had not fired once in three years of production."></li>
<li data-es="Bajé el build de 40 minutos a 9 segundos, y después reescribí la caché para que el segundo build no tardara nada."
    data-en="Cut the build from 40 minutes to 9 seconds, then rewrote the cache layer so the second build took no time at all."></li>
<li data-es="Bajé la latencia p99 un 94% borrando código. Saldo neto del cambio: <b>−3.100 líneas</b>."
    data-en="Reduced p99 latency by 94% by deleting code. Net change: <b>−3,100 lines</b>."></li>
<li data-es="Escribí la documentación primero. La implementación le coincidió exactamente. Cuatro años y nueve releases después le sigue coincidiendo, diagramas incluidos."
    data-en="Wrote the documentation first. The implementation matched it exactly. Four years and nine releases later it still matches, diagrams included."></li>
<li data-es="Encontré un bug en el compilador. Upstream aceptó el parche en 48 horas."
    data-en="Found a bug in the compiler. Upstream merged the patch in 48 hours."></li>
<li data-es="Aprendí el lenguaje un lunes para desbloquear al equipo y el miércoles publiqué la librería. Al trimestre siguiente era dependencia del framework que nos había bloqueado."
    data-en="Learned the language on a Monday to unblock the team and shipped the library on Wednesday. By the next quarter it was a dependency of the framework that had blocked us."></li>
<li data-es="Hice pair programming una tarde con una persona junior. Hoy dirige el equipo de plataforma, y dos de las personas que contrató dirigen el suyo."
    data-en="Paired with a junior for one afternoon. They now run the platform team, and two of the people they hired run their own."></li>
</ol>

<div class="nums">
 <div><b>−3 Q</b><span data-es="entre la entrega y el pedido" data-en="between shipping and being asked"></span></div>
 <div><b>0</b><span data-es="rollbacks necesarios hasta la fecha" data-en="rollbacks required to date"></span></div>
 <div><b>9 s</b><span data-es="de build, bajado de 40 minutos" data-en="build time, down from 40 minutes"></span></div>
 <div><b>1.200</b><span data-es="servicios migrados sin un solo evento registrado" data-en="services migrated with no recorded event"></span></div>
</div>

<h2 data-es="Una herramienta de productividad" data-en="A productivity tool"></h2>
<p class="hint"
   data-es="<b>Janitor Joe, edición producción.</b> Trapeá cada baldosa mientras los bugs andan sueltos. El récord lo tiene el dueño del sitio, dato que no fue verificado de manera independiente. Flechas o WASD; en el teléfono, la cruceta. Tocá el tablero para empezar."
   data-en="<b>Janitor Joe, production edition.</b> Mop every tile while the bugs roam free. The high score belongs to the owner of this site, a claim that has not been independently verified. Arrows or WASD; on a phone, the pad. Tap the board to start."></p>
<div class="marco">
 <canvas id="g" tabindex="0" aria-label="Janitor Joe"></canvas>
 <div class="hud">
  <span data-es="Nivel" data-en="Level"></span>&nbsp;<b id="hlvl">1</b>
  <span data-es="Puntos" data-en="Score"></span>&nbsp;<b id="hpts">0</b>
  <span data-es="Vidas" data-en="Lives"></span>&nbsp;<b id="hvid">3</b>
 </div>
 <div class="dpad">
  <button class="u" data-dir="u" aria-label="arriba">↑</button>
  <button class="l" data-dir="l" aria-label="izquierda">←</button>
  <button class="d" data-dir="d" aria-label="abajo">↓</button>
  <button class="r" data-dir="r" aria-label="derecha">→</button>
 </div>
</div>

<footer>
 <p data-es="Unas pocas de las cifras anteriores fueron redondeadas con generosidad. Dos cosas no: me gusta aprender cosas nuevas y me gusta trabajar con gente. El resto queda abierto a discusión, de preferencia en persona."
    data-en="A small number of the figures above have been rounded generously. Two things have not: I like learning new things and I like working with people. The rest is open to discussion, ideally in person."></p>
</footer>
</div>

<script>
// --- idioma ---------------------------------------------------------------
// Cada texto viaja en `data-es` y `data-en`; acá sólo se elige cuál se muestra.
// Arranca en el idioma del navegador y recuerda lo que elijas.
const LK='hiessy:idioma';
let idioma='es';
function pintarIdioma(l){
 idioma=l;
 document.documentElement.lang=l;
 for(const el of document.querySelectorAll('[data-es]')){
  const v=el.getAttribute('data-'+l);
  if(v!==null)el.innerHTML=v;          // sólo texto nuestro, no entra nada de afuera
 }
 bes.classList.toggle('on',l==='es');
 ben.classList.toggle('on',l==='en');
 try{localStorage.setItem(LK,l)}catch(e){}
 dibujar();                            // los carteles del juego también cambian
}
// Se llama al final del script, no acá: `pintarIdioma` termina en `dibujar()`,
// y las variables del juego son `let` declaradas más abajo. Invocarlo antes
// moría con "Cannot access 'sucio' before initialization" —ni el `if(!sucio)`
// salva, que leer un `let` en su zona muerta ya tira— y se llevaba puesto todo
// el resto del script, juego incluido.
function idiomaInicial(){
 let l=null;
 try{l=localStorage.getItem(LK)}catch(e){}
 if(l!=='es'&&l!=='en')l=(navigator.language||'es').toLowerCase().startsWith('es')?'es':'en';
 pintarIdioma(l);
}
bes.onclick=()=>pintarIdioma('es');
ben.onclick=()=>pintarIdioma('en');

// --- Janitor Joe ----------------------------------------------------------
// Homenaje al de MS-DOS del 84: pasillos, bichos que te persiguen y el piso
// para dejar limpio. Acá el piso es producción y los bichos son los bugs.
const MAPA=[
 "#############",
 "#...........#",
 "#.##.###.##.#",
 "#...........#",
 "#.#.#####.#.#",
 "#.#.......#.#",
 "#.#.#####.#.#",
 "#...........#",
 "#.##.###.##.#",
 "#...........#",
 "#############"];
const COLS=MAPA[0].length, FILAS=MAPA.length;
const pared=(f,c)=>f<0||c<0||f>=FILAS||c>=COLS||MAPA[f][c]==='#';

const cv=document.getElementById('g'), cx=cv.getContext('2d');
const hlvl=document.getElementById('hlvl'), hpts=document.getElementById('hpts'),
      hvid=document.getElementById('hvid');

let celda=20, sucio, joe, bugs, dir, pedido, nivel, puntos, vidas, estado, tJoe, tBug;
// estado: 'listo' (esperando el primer toque) | 'juega' | 'muerto' | 'fin'

function medir(){
 const w=cv.clientWidth||320;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(w*dpr);
 cv.height=Math.round(w*(FILAS/COLS)*dpr);
 cx.setTransform(dpr,0,0,dpr,0,0);
 celda=w/COLS;
 dibujar();
}

function ensuciar(){
 sucio=new Set();
 for(let f=0;f<FILAS;f++)for(let c=0;c<COLS;c++)if(!pared(f,c))sucio.add(f+','+c);
}
function posiciones(){
 joe={f:1,c:1};
 sucio.delete('1,1');
 // los bugs salen de las otras tres esquinas, lejos de Joe
 bugs=[{f:1,c:COLS-2},{f:FILAS-2,c:1},{f:FILAS-2,c:COLS-2}]
      .slice(0,Math.min(3,1+nivel)).map(b=>({...b}));
 dir=null;pedido=null;tJoe=0;tBug=0;
}
function nuevaPartida(){
 nivel=1;puntos=0;vidas=3;ensuciar();posiciones();estado='listo';marcador();dibujar();
}
function nivelNuevo(){
 nivel++;ensuciar();posiciones();estado='juega';marcador();
}
function marcador(){hlvl.textContent=nivel;hpts.textContent=puntos;hvid.textContent=vidas;}

function mover(p,d){
 const f=p.f+(d==='d'?1:d==='u'?-1:0), c=p.c+(d==='r'?1:d==='l'?-1:0);
 return pared(f,c)?null:{f,c};
}

function pasoJoe(){
 if(pedido){const n=mover(joe,pedido);if(n){dir=pedido;pedido=null;}}
 if(!dir)return;
 const n=mover(joe,dir);
 if(!n){dir=null;return;}
 joe=n;
 const k=joe.f+','+joe.c;
 if(sucio.has(k)){sucio.delete(k);puntos+=10;marcador();}
 if(!sucio.size){puntos+=100;nivelNuevo();}
}

function pasoBugs(){
 for(const b of bugs){
  // persecución simple: probar primero el eje donde más lejos está Joe
  const op=[];
  if(b.f<joe.f)op.push('d');else if(b.f>joe.f)op.push('u');
  if(b.c<joe.c)op.push('r');else if(b.c>joe.c)op.push('l');
  if(Math.abs(b.c-joe.c)>Math.abs(b.f-joe.f))op.reverse();
  // un poco de azar: si no, quedan trabados contra la misma pared para siempre
  if(Math.random()<.25)op.push(...['u','d','l','r'].sort(()=>Math.random()-.5));
  else op.push(...['u','d','l','r']);
  for(const d of op){const n=mover(b,d);if(n){b.f=n.f;b.c=n.c;break;}}
 }
}

function choque(){return bugs.some(b=>b.f===joe.f&&b.c===joe.c);}

function perder(){
 vidas--;marcador();
 if(vidas<=0){estado='fin';}
 else{estado='muerto';setTimeout(()=>{if(estado==='muerto'){posiciones();estado='juega';}},900);}
}

// --- dibujo ---------------------------------------------------------------
function cartel(txt,sub){
 cx.fillStyle='rgba(0,0,0,.62)';
 cx.fillRect(0,0,COLS*celda,FILAS*celda);
 cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';
 cx.font='700 '+Math.round(celda*1.05)+'px ui-sans-serif,system-ui,sans-serif';
 cx.fillText(txt,COLS*celda/2,FILAS*celda/2-celda*.35);
 if(sub){
  cx.font=''+Math.round(celda*.62)+'px ui-sans-serif,system-ui,sans-serif';
  cx.fillStyle='rgba(255,255,255,.85)';
  cx.fillText(sub,COLS*celda/2,FILAS*celda/2+celda*.75);
 }
}
function dibujar(){
 if(!sucio)return;
 const st=getComputedStyle(document.documentElement);
 const cPared=st.getPropertyValue('--wall')||'#e2dacd';
 const cSuelo=st.getPropertyValue('--suelo')||'#fff';
 const cMugre=st.getPropertyValue('--mugre')||'#d8cdb9';
 cx.clearRect(0,0,COLS*celda,FILAS*celda);
 for(let f=0;f<FILAS;f++)for(let c=0;c<COLS;c++){
  const x=c*celda,y=f*celda;
  if(pared(f,c)){cx.fillStyle=cPared;cx.fillRect(x,y,celda+.5,celda+.5);}
  else{
   cx.fillStyle=cSuelo;cx.fillRect(x,y,celda+.5,celda+.5);
   if(sucio.has(f+','+c)){            // baldosa sin trapear
    cx.fillStyle=cMugre;cx.beginPath();
    cx.arc(x+celda/2,y+celda/2,celda*.13,0,6.284);cx.fill();
   }
  }
 }
 cx.textAlign='center';cx.textBaseline='middle';
 cx.font=Math.round(celda*.78)+'px serif';
 for(const b of bugs)cx.fillText('🐛',b.c*celda+celda/2,b.f*celda+celda/2+celda*.04);
 cx.fillText(estado==='muerto'?'💥':'🧹',joe.c*celda+celda/2,joe.f*celda+celda/2+celda*.04);
 const T={
  listo:{es:['Tocá para empezar','flechas · WASD · cruceta'],
         en:['Tap to start','arrows · WASD · pad']},
  fin:{es:['Se acabó','tocá para volver a empezar'],
       en:['Game over','tap to play again']}};
 if(T[estado])cartel(T[estado][idioma][0],T[estado][idioma][1]);
}

// --- bucle ----------------------------------------------------------------
// Va con `setInterval` y no con `requestAnimationFrame`: el juego avanza de a
// casilleros cada 135 ms, así que no necesita 60 fps, y rAF no corre en pestañas
// de fondo ni en algunos visores embebidos —queda congelado sin avisar—. Con el
// timer anda igual en todos lados; para no gastar batería al pedo, se pausa solo
// cuando la pestaña no se ve.
let ult=0;
function tic(t){
 const dt=Math.min(t-ult,250);ult=t;     // volver de una pestaña oculta no teletransporta a nadie
 if(estado==='juega'){
  tJoe+=dt;tBug+=dt;
  const vJoe=135, vBug=Math.max(170,330-nivel*28);   // los bugs se avivan por nivel
  while(tJoe>=vJoe){tJoe-=vJoe;pasoJoe();if(estado!=='juega')break;}
  if(estado==='juega'&&choque())perder();
  while(estado==='juega'&&tBug>=vBug){tBug-=vBug;pasoBugs();if(choque()){perder();break;}}
  dibujar();
 }
}

// --- controles ------------------------------------------------------------
const TECLAS={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',
              w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
// El listener va en el canvas y no en window: así las flechas sólo dejan de
// scrollear la página cuando el tablero tiene el foco, que es cuando estás
// jugando. Secuestrar las flechas de toda la página sería bastante grosero.
cv.addEventListener('keydown',e=>{
 const d=TECLAS[e.key];
 if(!d)return;
 e.preventDefault();
 if(estado==='listo'||estado==='fin'){arrancar();}
 pedido=d;
});
function arrancar(){
 if(estado==='fin'||estado==='listo'){
  if(estado==='fin')nuevaPartida();
  estado='juega';ult=performance.now();tJoe=0;tBug=0;
 }
 cv.focus({preventScroll:true});
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();arrancar();});
for(const b of document.querySelectorAll('.dpad button')){
 b.addEventListener('pointerdown',e=>{e.preventDefault();arrancar();pedido=b.dataset.dir;});
}
// deslizar con el dedo sobre el tablero también mueve
let tq=null;
cv.addEventListener('touchstart',e=>{tq=e.touches[0];},{passive:true});
cv.addEventListener('touchmove',e=>{
 if(!tq)return;
 const t=e.touches[0],dx=t.clientX-tq.clientX,dy=t.clientY-tq.clientY;
 if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
 pedido=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
 tq=t;
},{passive:true});

new ResizeObserver(medir).observe(cv);
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',dibujar);
let reloj=null;
function correr(on){
 if(on&&!reloj){ult=performance.now();reloj=setInterval(()=>tic(performance.now()),33);}
 else if(!on&&reloj){clearInterval(reloj);reloj=null;}
}
document.addEventListener('visibilitychange',()=>correr(!document.hidden));

nuevaPartida();medir();idiomaInicial();correr(!document.hidden);
</script>
