<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranch 3D catalog</title>
<!-- A developer page, not linked from the site: browse every piece of the
     catalog, turn it round, and download it as .obj + .mtl. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 260px 1fr; height: 100vh; background: #f6f5f1; color: #222; }
  nav { overflow: auto; padding: 10px; border-right: 1px solid #ddd; background: #fff; }
  nav h3 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #777; }
  nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button:hover { background: #eee; } nav button.on { background: #222; color: #fff; }
  main { position: relative; } canvas { width: 100%; height: 100%; display: block; }
  .bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar b { background: #fff; padding: 6px 10px; border-radius: 8px; } .bar button { padding: 6px 10px; border-radius: 8px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  #status { position: absolute; bottom: 10px; left: 10px; background: #fff; padding: 6px 10px; border-radius: 8px; }
</style>
</head>
<body>
<nav id="list"></nav>
<main><canvas id="c"></canvas>
  <div class="bar"><b id="title">Choose a piece</b><button id="dl">Download .obj + .mtl</button><button id="save" title="Needs tools/save_server.py running">Save all to assets/models/obj</button></div>
  <div id="status"></div></main>
<script src="../model/survey.js"></script>
<script src="../model/house/rooms.js"></script>
<script src="../model/house/furniture.js"></script>
<script src="../model/house/neighbours.js"></script>
<script src="../model/house.js"></script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { palette } from "../../js/walk/materials.js";
import { CATALOG } from "./catalog.js";
import { toObj } from "./export-obj.js";

palette();
const $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9e7e0);
const cam = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x998f80, 2.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
scene.add(new THREE.GridHelper(4, 16, 0x999999, 0xcccccc));
const orbit = new OrbitControls(cam, $("c"));
let current = null, shown = null;

function resize() { const m = document.querySelector("main"); renderer.setSize(m.clientWidth, m.clientHeight, false); cam.aspect = m.clientWidth / m.clientHeight; cam.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();

function show(item) {
  if (shown) scene.remove(shown);
  shown = item.make(); scene.add(shown); current = item;
  const box = new THREE.Box3().setFromObject(shown), s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z, 0.3) * 1.6;
  orbit.target.copy(c); cam.position.set(c.x + r * 0.8, c.y + r * 0.6, c.z + r * 1.1); orbit.update();
  $("title").textContent = item.name + " · " + s.x.toFixed(2) + " × " + s.y.toFixed(2) + " × " + s.z.toFixed(2) + " m";
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.id === item.id));
}
let cat = "";
CATALOG.forEach((it) => {
  if (it.cat !== cat) { cat = it.cat; const h = document.createElement("h3"); h.textContent = cat; $("list").appendChild(h); }
  const b = document.createElement("button"); b.textContent = it.name; b.dataset.id = it.id; b.onclick = () => show(it); $("list").appendChild(b);
});
function file(name, text) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" })); a.download = name; a.click(); }
$("dl").onclick = () => { if (!current) return; const g = current.make(), r = toObj(g, current.id); file(current.id + ".obj", r.obj); setTimeout(() => file(current.id + ".mtl", r.mtl), 200); };
$("save").onclick = async () => {
  let ok = 0;
  for (const it of CATALOG) {
    const r = toObj(it.make(), it.id);
    try {
      await fetch("http://127.0.0.1:8125/" + it.id + ".obj", { method: "POST", body: r.obj });
      await fetch("http://127.0.0.1:8125/" + it.id + ".mtl", { method: "POST", body: r.mtl });
      ok++; $("status").textContent = "Saved " + ok + " / " + CATALOG.length;
    } catch (e) { $("status").textContent = "Could not reach the save server on :8125"; return; }
  }
};
(function loop() { requestAnimationFrame(loop); orbit.update(); renderer.render(scene, cam); })();
window.CATALOG = CATALOG;
show(CATALOG[0]);
</script>
</body>
</html>
